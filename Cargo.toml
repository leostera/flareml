[package]
name = "flareml"
version = "0.1.0"
edition = "2024"
description = "A finite systems modeling language and native model checker"

[[bin]]
name = "fml"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
logos = "0.16"
petgraph = "0.8"
miette = { version = "7", features = ["fancy"] }
humantime = "2"
owo-colors = "4"
supports-color = "3"

[dev-dependencies]
tempfile = "3"
proptest = "1"
